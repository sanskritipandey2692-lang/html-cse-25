<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
</head>
<body>
<h1 align="center">Student Registration Form</h1>
<hr>
<!--Registration Form-->
<form method="post" action ="submit.html">

<!--Full Name-->
<p>
<label>Full Name:</label>
<input type="text" name="fullname" placeholder="Enter your full name" required>
</p>


<!--Email with validation-->
<p>
<label>Email:</label>
<input type="email" name="email" placeholder="enter your email address" required>
</p>


<!--Password-->
<p>
<label>Password:</label>
<input type="password" name="password" placeholder="enter password" required>
</p>

<!--Gender(radio buttons)-->
<p>
<label>Gender:</label>
<input type="radio" name="gender" value="male" required>Male
<input type="radio" name="gender" value="female" required>Female
</p>

<!--Course Selection(Dropdown)-->
<p>
<label>Course:</label>
<select name="course" required>
<option value="">--Select Course--</option value>
<option value="btech">B.Tech</option>
<option value="bca">BCA</option>
<option value="mca">MCA</option>
<option value="mba">MBA</option>
</select>
</p>

<!--Contact Number-->
        <p>
            <label>Contact No:</label>
            <input type="tel" name="contact" placeholder="Enter phone number" required>
        </p>

        <!--Address(Textarea)-->
        <p>
            <label>Address:</label><br>
            <textarea name="address" rows="4" cols="40" placeholder="Enter your address" required></textarea>
        </p>

        <!--Submit and Reset-->
        <p>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </p>
        </form>
        
        <hr>
        <p align="center">&copy:2026 Student Registration Portal</p>
</body>
</html>
